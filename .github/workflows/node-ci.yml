name: Node CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-duck

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: node-duck/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (no warnings allowed)
        run: npm run lint

      - name: Check formatting (no format errors allowed)
        run: npm run format:check

      - name: Run tests
        run: npm test

  package:
    needs: test
    # Körs bara på push till main, aldrig på PR. Körs bara om testerna är gröna (needs).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Medvetet minimalt paket: bara det som behövs för att köra appen.
      # Utesluts: tests/, node_modules/ (enbart devDependencies här),
      # eslint.config.js, .prettierrc, coverage, package-lock.json.
      - name: Create ZIP package
        run: zip -r duck-js.zip node-duck/package.json node-duck/src

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: duck-js-package
          path: duck-js.zip
